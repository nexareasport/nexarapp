<style>:root{--bg:#0a0a0c;--card:#16161a;--card2:#1e1e23;--text:#f4f4f5;--muted:#9b9ba4;--line:#2a2a30;--red:#c4121f;--red2:#e11d2e;--ok:#22c55e;--warn:#f59e0b;--r:16px}
:root[data-theme=light]{--bg:#f4f4f6;--card:#fff;--card2:#efeff2;--text:#111114;--muted:#666672;--line:#e1e1e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:680px;margin:0 auto;padding:12px 14px}
h1,h2,h3{margin:0 0 8px;letter-spacing:.3px}h2{font-size:19px}h3{font-size:16px}
.center{display:flex;justify-content:center;padding:60px 0}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--red2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5}
nav[hidden],#toast[hidden]{display:none}
nav button{flex:1;border:0;border-radius:14px;padding:10px 0;background:transparent;color:var(--muted);font:700 13px inherit;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}
nav button span{font-size:19px}nav button.on{background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--red);color:#fff;font:700 15px inherit;cursor:pointer;width:100%;display:block;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}.btn.sec{background:var(--card2);color:var(--text)}.btn.ok{background:var(--ok)}.btn.sm{width:auto;padding:8px 12px;font-size:13px;display:inline-block;border-radius:10px}
.btn[disabled]{opacity:.5}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font:700 11px inherit;background:var(--card2);color:var(--muted);text-transform:uppercase}
.chip.open{background:rgba(34,197,94,.15);color:var(--ok)}.chip.full{background:rgba(245,158,11,.15);color:var(--warn)}.chip.closed,.chip.finished{background:rgba(225,29,46,.15);color:var(--red2)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:15px inherit}
textarea{min-height:80px;resize:vertical}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}
.err{color:var(--red2);font-size:13px;margin-top:6px}
.back{background:none;border:0;color:var(--muted);font:600 14px inherit;padding:4px 0 10px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 14px;font:600 13px inherit}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.hero{position:relative;height:150px;border-radius:var(--r);overflow:hidden;margin-bottom:14px;background:#000}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background:linear-gradient(135deg,#000 0%,#3a0a0e 55%,var(--red) 130%);background-size:cover;background-position:center;opacity:0;transform:translateX(24px);transition:opacity .6s,transform .6s;color:#fff}
.slide.on{opacity:1;transform:none}.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 70%)}
.slide>*{position:relative;z-index:1}.slide b{font-size:20px;letter-spacing:.5px}.slide span{opacity:.85;font-size:13px}
.dots{position:absolute;right:12px;top:10px;display:flex;gap:5px;z-index:2}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:20px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 6px;font:700 12px inherit;margin:3px 4px 3px 0}
.badge img,.bico{width:20px;height:20px;border-radius:50%;object-fit:cover;font-size:15px;line-height:20px;text-align:center}
.list>*{border-bottom:1px solid var(--line);padding:10px 0}.list>*:last-child{border:0}
.bracket{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:178px}
.round h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;text-align:center}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mc .p{padding:8px 10px;display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.mc .p+.p{border-top:1px solid var(--line)}.mc .p.w{background:rgba(196,18,31,.18);color:var(--red2)}.mc .p.e{color:var(--muted);font-weight:400;font-style:italic}
.mc .foot{padding:5px 10px;font-size:11px;color:var(--muted);background:var(--card2);display:flex;justify-content:space-between;align-items:center}
.champ{text-align:center;background:linear-gradient(135deg,#000,#3a0a0e);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;font-size:18px;font-weight:800}
#toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;text-align:center;font-weight:600}
#toast.bad{background:var(--red)}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.noanim *{transition:none!important;animation:none!important}
.noanim .spinner{animation:sp .8s linear infinite!important}
.toggle{display:flex;gap:8px}.toggle button{flex:1}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>
<nav id="nav" hidden>
  <button data-tab="turnir"><span>🏆</span>TURNIR</button>
  <button data-tab="profil"><span>👤</span>PROFIL</button>
</nav>
<div id="toast" hidden></div>
<script>"use strict";
// NEXAR TDM ARENA — interfeys (faqat o'zbek tilida). Barcha ma'lumotlar serverdan olinadi.
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (iso) => { if (!iso) return "Sana belgilanmagan"; const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toInput = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const STATUS = { open: "Ro'yxat ochiq", full: "Joylar to'lgan", closed: "Yopiq", finished: "Yakunlangan" };
const REGS = { pending: "Kutilmoqda", approved: "Tasdiqlangan", rejected: "Rad etilgan" };

// --- Sozlamalar (faqat ko'rinish: mavzu va animatsiya) ---
let prefs = { theme: "", anim: true };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("nexar_prefs") || "{}")); } catch (_) {}
function applyPrefs() {
  document.documentElement.dataset.theme = prefs.theme || (tg && tg.colorScheme === "light" ? "light" : "dark");
  document.body.classList.toggle("noanim", !prefs.anim);
  try { localStorage.setItem("nexar_prefs", JSON.stringify(prefs)); } catch (_) {}
}
applyPrefs();

// --- Yordamchilar ---
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || "" }, body: body !== undefined ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error(d.error || "Xatolik yuz berdi"); e.status = r.status; throw e; }
  return d;
}
let toastT;
function toast(msg, bad) { const t = document.getElementById("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }
function ask(msg) { return new Promise((res) => { if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) tg.showConfirm(msg, res); else res(window.confirm(msg)); }); }
async function run(fn, ok) { try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message, true); return null; } }
const chip = (s) => `<span class="chip ${s}">${STATUS[s]}</span>`;
const badgeHtml = (b) => `<span class="badge" title="${esc(b.description)}">${b.icon && b.icon.startsWith("data:") ? `<img src="${esc(b.icon)}" alt="">` : `<span class="bico">${esc(b.icon)}</span>`}${esc(b.name)}</span>`;
function pickImage(maxDim, type, cb) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, maxDim / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL(type, 0.8));
    }; img.onerror = () => toast("Rasm o'qilmadi", true); img.src = URL.createObjectURL(f);
  }; inp.click();
}

// --- Navigatsiya ---
const st = { tab: "turnir", stack: [], view: { name: "home" }, me: null, ad: { tab: "tour" }, draft: null };
const views = {};
function go(name, params = {}) { st.stack.push(st.view); st.view = { name, ...params }; render(); window.scrollTo(0, 0); }
function back() { st.view = st.stack.pop() || { name: st.tab === "turnir" ? "home" : "profile" }; render(); }
async function render() {
  document.getElementById("nav").hidden = false;
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === st.tab));
  app.innerHTML = '<div class="center"><div class="spinner"></div></div>';
  try {
    if (!st.me) st.me = await api("GET", "/api/me");
    await views[st.view.name](st.view);
  } catch (e) {
    const auth = e.status === 401 || !(tg && tg.initData);
    app.innerHTML = `<div class="card empty"><h3>${auth ? "Telegram orqali oching" : "Xatolik"}</h3><p>${auth ? "Bu ilova faqat Telegram ichida ishlaydi. @neexarbot orqali oching." : esc(e.message)}</p>${auth ? "" : '<button class="btn" data-act="reload">Qayta urinish</button>'}</div>`;
    document.getElementById("nav").hidden = auth;
  }
}
const back_ = '<button class="back" data-act="back">← Orqaga</button>';

// --- TURNIR ---
function tCard(t) {
  const pct = Math.min(100, Math.round((t.taken / t.capacity) * 100));
  return `<div class="card" data-act="openT" data-id="${t.id}" style="cursor:pointer">
    <div class="row between"><h3 class="grow">${esc(t.name)}</h3>${chip(t.reg_status)}</div>
    <div class="muted">🗺 ${esc(t.map || "Xarita belgilanmagan")} · 🕒 ${fmtDate(t.start_at)}</div>
    <div class="row between" style="margin:10px 0 6px"><span class="small muted">Joylar</span><b>${t.taken} / ${t.capacity}</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${t.champion ? `<div class="small" style="margin-top:8px">🏆 Chempion: <b>${esc(t.champion)}</b></div>` : ""}
    ${t.my_status ? `<div class="small muted" style="margin-top:6px">Sizning arizangiz: ${REGS[t.my_status]}</div>` : ""}</div>`;
}
let heroTimer;
function heroHtml(bn) {
  if (!bn.length) return "";
  return `<div class="hero">${bn.map((b, i) => `<div class="slide ${i === 0 ? "on" : ""}" style="${b.image ? `background-image:url('${esc(b.image)}')` : ""}"><b>${esc(b.title)}</b><span>${esc(b.subtitle)}</span></div>`).join("")}
    <div class="dots">${bn.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div></div>`;
}
function startHero() {
  clearInterval(heroTimer);
  const s = [...document.querySelectorAll(".hero .slide")], d = [...document.querySelectorAll(".hero .dots i")];
  if (s.length < 2 || !prefs.anim) return;
  let i = 0; heroTimer = setInterval(() => {
    if (!document.body.contains(s[0])) return clearInterval(heroTimer);
    s[i].classList.remove("on"); d[i].classList.remove("on"); i = (i + 1) % s.length; s[i].classList.add("on"); d[i].classList.add("on");
  }, 4000);
}
views.home = async () => {
  const [bn, ts] = await Promise.all([api("GET", "/api/banners"), api("GET", "/api/tournaments")]);
  app.innerHTML = heroHtml(bn) + "<h2>Turnirlar</h2>" + (ts.length ? ts.map(tCard).join("") : '<div class="card empty">Hozircha turnirlar yo\'q</div>');
  startHero();
};
function bracketHtml(rounds, admin) {
  if (!rounds) return "";
  const pl = (m, n) => {
    const p = m["p" + n]; const w = m.winner === n;
    if (!p) return `<div class="p e"><span>${m.bye && n === 2 ? "Bye" : "Kutilmoqda"}</span></div>`;
    const btn = admin && !m.bye && m.p1 && m.p2 && !w ? `<button class="btn sm" data-act="win" data-m="${m.id}" data-w="${p.id}">G'olib</button>` : "";
    return `<div class="p ${w ? "w" : ""}"><span>${esc(p.nick)}${w ? " ✓" : ""}</span>${btn}</div>`;
  };
  const lbl = { waiting: "Kutilmoqda", ready: "O'yin kutilmoqda", done: "Tugagan", bye: "Bye" };
  return `<div class="bracket">${rounds.map((r) => `<div class="round"><h4>${esc(r.name)}</h4>${r.matches.map((m) => `<div class="mc">${pl(m, 1)}${pl(m, 2)}<div class="foot"><span>${lbl[m.status]}</span>${admin && m.status === "done" ? `<button class="btn sm sec" data-act="unwin" data-m="${m.id}">Bekor qilish</button>` : ""}</div></div>`).join("")}</div>`).join("")}</div>`;
}
views.tournament = async (v) => {
  const d = await api("GET", "/api/tournaments/" + v.id); const t = d.tournament;
  let action = "";
  if (t.my_status && t.my_status !== "rejected") action = `<div class="card"><b>Siz ro'yxatdasiz:</b> ${REGS[t.my_status]}</div>` + (!t.has_bracket ? `<button class="btn sec" data-act="unreg" data-id="${t.id}">Arizani bekor qilish</button>` : "");
  else if (t.my_status === "rejected") action = '<div class="card">Arizangiz rad etilgan.</div>';
  else if (t.reg_status === "open") action = `<button class="btn" data-act="reg" data-id="${t.id}">Ro'yxatdan o'tish</button>`;
  else action = `<div class="card">${t.reg_status === "full" ? "Joylar to'lgan." : t.reg_status === "closed" ? "Ro'yxatdan o'tish yopilgan." : "Turnir yakunlangan."}</div>`;
  app.innerHTML = `${back_}<div class="card"><div class="row between"><h2 class="grow">${esc(t.name)}</h2>${chip(t.reg_status)}</div>
    <div class="muted">🗺 ${esc(t.map || "—")} · 🕒 ${fmtDate(t.start_at)}</div>
    ${t.description ? `<p style="white-space:pre-wrap">${esc(t.description)}</p>` : ""}
    <div class="row between"><span class="muted">Bo'sh joylar</span><b>${Math.max(0, t.capacity - t.taken)} / ${t.capacity}</b></div></div>
    ${t.champion ? `<div class="champ">🏆 CHEMPION<br>${esc(t.champion)}</div>` : ""}${action}
    <h3 style="margin-top:16px">Bracket</h3>${d.bracket ? bracketHtml(d.bracket, false) : '<div class="card empty">Bracket hali tuzilmagan</div>'}
    <h3>Ishtirokchilar (${d.participants.length})</h3><div class="card list">${d.participants.length ? d.participants.map((p, i) => `<div class="row between"><span>${i + 1}. ${esc(p.nick)}</span><span class="muted small">${REGS[p.status]}</span></div>`).join("") : '<div class="empty">Hali hech kim yozilmagan</div>'}</div>`;
};

// --- PROFIL ---
views.profile = async () => {
  st.me = await api("GET", "/api/me"); const m = st.me; const name = [m.first_name, m.last_name].filter(Boolean).join(" ") || "Foydalanuvchi";
  app.innerHTML = `<div class="card row">${m.photo_url ? `<img class="avatar" src="${esc(m.photo_url)}" alt="">` : `<div class="avatar">${esc(name[0])}</div>`}
    <div class="grow"><h2 style="margin:0">${esc(name)}</h2><div class="muted">${m.username ? "@" + esc(m.username) : "Username yo'q"}</div><div class="muted small">Telegram ID: ${m.id}</div></div></div>
    <div class="card"><h3>PUBG Mobile ma'lumotlari</h3>
      <label>PUBG nikneym</label><input id="nick" maxlength="24" value="${esc(m.pubg_nick || "")}" placeholder="Masalan: NEXAR_Sniper">
      <label>PUBG ID (faqat raqam)</label><input id="pid" inputmode="numeric" maxlength="15" value="${esc(m.pubg_id || "")}" placeholder="5123456789">
      <div class="err" id="perr"></div><div style="height:10px"></div><button class="btn" data-act="saveP">Saqlash</button></div>
    <div class="card stats"><div><b>${m.stats.tournaments}</b><span class="muted small">Turnir</span></div><div><b>${m.stats.wins}</b><span class="muted small">G'alaba</span></div><div><b>${m.stats.losses}</b><span class="muted small">Mag'lubiyat</span></div><div><b>${m.stats.titles}</b><span class="muted small">Chempion</span></div></div>
    <div class="card"><h3>Nishonlar</h3>${m.badges.length ? m.badges.map(badgeHtml).join("") : '<span class="muted">Hozircha nishon yo\'q</span>'}</div>
    <div class="card"><h3>Turnirlarim</h3>${m.history.length ? `<div class="list">${m.history.map((h) => `<div class="row between"><span>${esc(h.name)}</span><b class="small">${esc(h.result)}</b></div>`).join("")}</div>` : '<span class="muted">Hali qatnashmagansiz</span>'}</div>
    <button class="btn sec" data-act="go" data-v="settings">⚙️ Sozlamalar</button><div style="height:8px"></div>
    <button class="btn sec" data-act="go" data-v="help">🆘 Yordam / SOS</button>
    ${m.is_admin ? '<div style="height:8px"></div><button class="btn" data-act="go" data-v="admin">🛠 Admin panel</button>' : ""}`;
  const pid = document.getElementById("pid"); pid.oninput = () => (pid.value = pid.value.replace(/\D/g, ""));
};
views.settings = async () => {
  app.innerHTML = `${back_}<div class="card"><h3>Mavzu</h3><div class="toggle"><button class="btn ${prefs.theme !== "light" && (prefs.theme || !(tg && tg.colorScheme === "light")) ? "" : "sec"}" data-act="theme" data-v="dark">🌙 Qora</button><button class="btn ${document.documentElement.dataset.theme === "light" ? "" : "sec"}" data-act="theme" data-v="light">☀️ Oq</button></div></div>
    <div class="card"><h3>Animatsiyalar</h3><div class="toggle"><button class="btn ${prefs.anim ? "" : "sec"}" data-act="anim" data-v="1">Yoqilgan</button><button class="btn ${prefs.anim ? "sec" : ""}" data-act="anim" data-v="0">O'chirilgan</button></div></div>`;
};
views.help = async () => {
  app.innerHTML = `${back_}<div class="card"><h3>Yordam / SOS</h3><p>Savol yoki muammo bo'lsa, administrator bilan bog'laning.</p><p class="muted">Administrator: <b>@mirzhayev</b></p>
    <a class="btn" href="https://t.me/mirzhayev" data-act="tglink">Telegramda yozish</a></div>
    <div class="card"><h3>Qanday qatnashaman?</h3><div class="muted">1. PROFIL bo'limida PUBG nikneym va ID kiriting.<br>2. TURNIR bo'limidan turnirni tanlab, ro'yxatdan o'ting.<br>3. Administrator arizangizni tasdiqlaydi.<br>4. Bracket tuzilgach, o'yin tartibini turnir sahifasida ko'rasiz.</div></div>`;
};

// --- ADMIN ---
const ADT = [["tour", "Turnirlar"], ["players", "O'yinchilar"], ["banners", "Bannerlar"], ["badges", "Nishonlar"], ["stats", "Holat"]];
views.admin = async () => {
  const ad = st.ad; let body = "";
  if (ad.tab === "tour") {
    const ts = await api("GET", "/api/admin/tournaments");
    body = `<button class="btn" data-act="go" data-v="adminTForm">➕ Yangi turnir</button><div style="height:12px"></div>` + (ts.length ? ts.map((t) => `<div class="card"><div class="row between"><h3 class="grow">${esc(t.name)}</h3>${chip(t.reg_status)}</div>
      <div class="muted small">${t.published ? "✅ E'lon qilingan" : "📝 Qoralama"} · ${t.taken}/${t.capacity} joy · ${fmtDate(t.start_at)}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="go" data-v="adminT" data-id="${t.id}">Boshqarish</button><button class="btn sm sec" data-act="go" data-v="adminTForm" data-id="${t.id}">Tahrirlash</button></div></div>`).join("") : '<div class="empty">Turnirlar yo\'q</div>');
  } else if (ad.tab === "players") {
    body = `<input id="psearch" placeholder="Nikneym, PUBG ID yoki Telegram ID" value="${esc(ad.q || "")}"><div style="height:8px"></div><button class="btn" data-act="psearch">Qidirish</button><div style="height:12px"></div>`;
    const ps = await api("GET", "/api/admin/players?q=" + encodeURIComponent(ad.q || ""));
    body += ps.length ? `<div class="card list">${ps.map((p) => `<div data-act="go" data-v="adminPlayer" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.pubg_nick || "(PUBG kiritilmagan)")}</b><div class="muted small">PUBG ID: ${esc(p.pubg_id || "—")} · TG: ${p.id}${p.username ? " · @" + esc(p.username) : ""}</div></div>`).join("")}</div>` : '<div class="empty">Hech narsa topilmadi</div>';
  } else if (ad.tab === "banners") {
    const bs = st.ad.banners = await api("GET", "/api/admin/banners");
    body = `<button class="btn" data-act="go" data-v="bannerForm">➕ Yangi banner</button><div style="height:12px"></div>` + bs.map((b, i) => `<div class="card"><div class="row between"><b class="grow">${esc(b.title)}</b><span class="chip ${b.enabled ? "open" : "closed"}">${b.enabled ? "Yoqilgan" : "O'chirilgan"}</span></div><div class="muted small">${esc(b.subtitle)}</div>
      <div class="row wrap" style="margin-top:10px"><button class="btn sm sec" data-act="bmove" data-i="${i}" data-d="-1">▲</button><button class="btn sm sec" data-act="bmove" data-i="${i}" data-d="1">▼</button><button class="btn sm" data-act="go" data-v="bannerForm" data-id="${b.id}">Tahrirlash</button></div></div>`).join("");
  } else if (ad.tab === "badges") {
    const bs = await api("GET", "/api/admin/badges");
    body = `<button class="btn" data-act="go" data-v="badgeForm">➕ Yangi nishon</button><div style="height:12px"></div>` + bs.map((b) => `<div class="card row">${badgeHtml(b)}<div class="grow muted small">${esc(b.description)}<br>Berilgan: ${b.awarded} · ${b.enabled ? "yoqilgan" : "o'chirilgan"}</div><button class="btn sm" data-act="go" data-v="badgeForm" data-id="${b.id}">✏️</button></div>`).join("");
  } else {
    const [s, h] = await Promise.all([api("GET", "/api/admin/stats"), api("GET", "/api/admin/status")]);
    body = `<div class="card list">${[["Foydalanuvchilar", s.users], ["PUBG profili borlar", s.profiles], ["Turnirlar", s.tournaments], ["E'lon qilingan", s.published], ["Yakunlangan", s.finished], ["Arizalar", s.registrations], ["Kutilayotgan arizalar", s.pending], ["O'ynalgan matchlar", s.matches_played], ["Berilgan nishonlar", s.badges_awarded]].map(([k, v]) => `<div class="row between"><span>${k}</span><b>${v}</b></div>`).join("")}</div>
    <div class="card"><h3>Tizim holati</h3><div class="muted small">Ma'lumotlar bazasi: ${h.db ? "✅" : "❌"}<br>Bot tokeni: ${h.bot_token_set ? "✅ kiritilgan" : "❌ yo'q"}<br>Admin ID: ${h.admin_id_set ? "✅" : "❌"}<br>Webhook: ${esc(h.bot.webhook)}<br>Menyu tugmasi: ${esc(h.bot.menu)}<br>Ishlash vaqti: ${h.uptime_min} daqiqa</div></div>
    <div class="card"><h3>Oxirgi xatolar</h3>${h.errors.length ? `<div class="list">${h.errors.map((e) => `<div class="small"><b>${esc(e.at)}</b> [${esc(e.place)}]<br>${esc(e.message)}</div>`).join("")}</div>` : '<span class="muted">Xatolar yo\'q ✅</span>'}</div>`;
  }
  app.innerHTML = `${back_}<h2>Admin panel</h2><div class="tabs">${ADT.map(([k, n]) => `<button class="${ad.tab === k ? "on" : ""}" data-act="adtab" data-v="${k}">${n}</button>`).join("")}</div>${body}`;
};
views.adminTForm = async (v) => {
  const t = v.id ? (await api("GET", "/api/admin/tournaments/" + v.id)).tournament : { name: "", description: "", map: "", capacity: 16, reg_status: "open", published: false };
  app.innerHTML = `${back_}<div class="card"><h2>${v.id ? "Turnirni tahrirlash" : "Yangi turnir"}</h2>
    <label>Nomi</label><input id="f_name" maxlength="80" value="${esc(t.name)}">
    <label>Tavsif</label><textarea id="f_desc" maxlength="1000">${esc(t.description)}</textarea>
    <label>Boshlanish vaqti</label><input id="f_start" type="datetime-local" value="${toInput(t.start_at)}">
    <label>Xarita</label><input id="f_map" list="maps" maxlength="40" value="${esc(t.map)}"><datalist id="maps"><option>TDM — Warehouse</option><option>TDM — Hangar</option><option>TDM — Ruins</option><option>TDM — Library</option><option>TDM — Cage</option></datalist>
    <label>O'yinchilar soni (istalgan son, 2–1000)</label><input id="f_cap" type="number" min="2" max="1000" value="${t.capacity}">
    <label>Ro'yxatdan o'tish holati</label><select id="f_reg">${Object.entries(STATUS).map(([k, n]) => `<option value="${k}" ${t.reg_status === k ? "selected" : ""}>${n}</option>`).join("")}</select>
    <label>E'lon qilish</label><select id="f_pub"><option value="0" ${t.published ? "" : "selected"}>Yo'q (qoralama)</option><option value="1" ${t.published ? "selected" : ""}>Ha (foydalanuvchilar ko'radi)</option></select>
    <div class="err" id="ferr"></div><div style="height:10px"></div><button class="btn" data-act="saveT" data-id="${v.id || ""}">Saqlash</button>
    ${v.id ? `<div style="height:8px"></div><button class="btn sec" data-act="delT" data-id="${v.id}">🗑 Turnirni o'chirish</button>` : ""}</div>`;
};
views.adminT = async (v) => {
  const d = await api("GET", "/api/admin/tournaments/" + v.id); const t = d.tournament;
  const champ = t.champion ? `<div class="champ">🏆 CHEMPION<br>${esc(t.champion)}</div>` : "";
  app.innerHTML = `${back_}<div class="card"><div class="row between"><h2 class="grow">${esc(t.name)}</h2>${chip(t.reg_status)}</div><div class="muted small">Joylar: ${t.taken}/${t.capacity} · Tasdiqlangan: ${t.approved}</div></div>${champ}
    <h3>Bracket</h3>${d.bracket ? bracketHtml(d.bracket, true) + `<button class="btn sec" data-act="resetB" data-id="${t.id}">Bracketni qayta o'rnatish</button>` : `<button class="btn" data-act="genB" data-id="${t.id}">⚡ Bracket tuzish (${t.approved} ta tasdiqlangan)</button>`}
    <div class="row between" style="margin-top:16px"><h3>Arizalar (${d.registrations.length})</h3>${d.bracket ? "" : `<button class="btn sm" data-act="apprAll" data-id="${t.id}">Hammasini tasdiqlash</button>`}</div>
    <div class="card list">${d.registrations.length ? d.registrations.map((r) => `<div><div class="row between"><b>${esc(r.pubg_nick)}</b><span class="chip ${r.status === "approved" ? "open" : r.status === "rejected" ? "closed" : "full"}">${REGS[r.status]}</span></div>
      <div class="muted small">PUBG ID: ${esc(r.pubg_id)} · TG: ${r.user_id}${r.username ? " · @" + esc(r.username) : ""}</div>
      ${d.bracket ? "" : `<div class="row wrap" style="margin-top:6px"><button class="btn sm ok" data-act="reg2" data-id="${t.id}" data-u="${r.user_id}" data-s="approve">Tasdiqlash</button><button class="btn sm sec" data-act="reg2" data-id="${t.id}" data-u="${r.user_id}" data-s="reject">Rad etish</button><button class="btn sm sec" data-act="reg2" data-id="${t.id}" data-u="${r.user_id}" data-s="remove">Olib tashlash</button></div>`}</div>`).join("") : '<div class="empty">Arizalar yo\'q</div>'}</div>`;
};
views.adminPlayer = async (v) => {
  const d = await api("GET", "/api/admin/players/" + v.id); const u = d.user;
  app.innerHTML = `${back_}<div class="card"><h2>${esc(u.pubg_nick || "PUBG kiritilmagan")}</h2><div class="muted small">${esc([u.first_name, u.last_name].filter(Boolean).join(" "))} ${u.username ? "· @" + esc(u.username) : ""}<br>PUBG ID: ${esc(u.pubg_id || "—")} · Telegram ID: ${u.id}</div>
    ${u.username ? `<div style="height:8px"></div><a class="btn sm" data-act="tglink" href="https://t.me/${esc(u.username)}">Telegramda yozish</a>` : ""}</div>
    <div class="card stats"><div><b>${d.stats.tournaments}</b><span class="muted small">Turnir</span></div><div><b>${d.stats.wins}</b><span class="muted small">G'alaba</span></div><div><b>${d.stats.losses}</b><span class="muted small">Mag'lubiyat</span></div><div><b>${d.stats.titles}</b><span class="muted small">Chempion</span></div></div>
    <div class="card"><h3>Nishonlar (bosib bering / oling)</h3>${d.badges.map((b) => `<div class="row between" style="padding:6px 0">${badgeHtml(b)}<button class="btn sm ${b.owned ? "sec" : "ok"}" data-act="bdg" data-u="${u.id}" data-b="${b.id}" data-o="${b.owned ? 1 : 0}">${b.owned ? "Olib tashlash" : "Berish"}</button></div>`).join("")}</div>
    <div class="card"><h3>Turnir tarixi</h3>${d.history.length ? `<div class="list">${d.history.map((h) => `<div class="row between"><span>${esc(h.name)}</span><b class="small">${esc(h.result)}</b></div>`).join("")}</div>` : '<span class="muted">Yo\'q</span>'}</div>`;
};
views.bannerForm = async (v) => {
  const b = v.id ? (await api("GET", "/api/admin/banners")).find((x) => x.id == v.id) : { title: "", subtitle: "", image: null, enabled: 1 };
  st.draft = { image: b.image };
  app.innerHTML = `${back_}<div class="card"><h2>${v.id ? "Bannerni tahrirlash" : "Yangi banner"}</h2><label>Sarlavha</label><input id="b_title" maxlength="60" value="${esc(b.title)}">
    <label>Qo'shimcha matn</label><input id="b_sub" maxlength="120" value="${esc(b.subtitle)}"><label>Rasm (ixtiyoriy)</label><div id="b_prev" class="small muted">${b.image ? `<img src="${esc(b.image)}" style="width:100%;border-radius:12px">` : "Rasm tanlanmagan (standart qizil dizayn)"}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm sec" data-act="bimg">Rasm tanlash</button><button class="btn sm sec" data-act="bimgx">Rasmni olib tashlash</button></div>
    <label>Holat</label><select id="b_on"><option value="1" ${b.enabled ? "selected" : ""}>Yoqilgan</option><option value="0" ${b.enabled ? "" : "selected"}>O'chirilgan</option></select>
    <div style="height:12px"></div><button class="btn" data-act="saveB" data-id="${v.id || ""}">Saqlash</button>${v.id ? `<div style="height:8px"></div><button class="btn sec" data-act="delB" data-id="${v.id}">🗑 O'chirish</button>` : ""}</div>`;
};
views.badgeForm = async (v) => {
  const b = v.id ? (await api("GET", "/api/admin/badges")).find((x) => x.id == v.id) : { name: "", icon: "🏅", description: "", enabled: 1 };
  st.draft = { icon: b.icon };
  app.innerHTML = `${back_}<div class="card"><h2>${v.id ? "Nishonni tahrirlash" : "Yangi nishon"}</h2><label>Nomi</label><input id="g_name" maxlength="30" value="${esc(b.name)}">
    <label>Belgi (emoji yoki rasm)</label><div id="g_prev">${badgeHtml({ ...b, name: "Ko'rinishi" })}</div><input id="g_icon" maxlength="16" value="${b.icon.startsWith("data:") ? "" : esc(b.icon)}" placeholder="Emoji, masalan 🏆">
    <div style="height:8px"></div><button class="btn sm sec" data-act="gimg">Rasm yuklash</button>
    <label>Tavsif</label><input id="g_desc" maxlength="200" value="${esc(b.description)}"><label>Holat</label><select id="g_on"><option value="1" ${b.enabled ? "selected" : ""}>Yoqilgan</option><option value="0" ${b.enabled ? "" : "selected"}>O'chirilgan</option></select>
    <div style="height:12px"></div><button class="btn" data-act="saveG" data-id="${v.id || ""}">Saqlash</button>${v.id ? `<div style="height:8px"></div><button class="btn sec" data-act="delG" data-id="${v.id}">🗑 O'chirish</button>` : ""}</div>`;
};

// --- Tugmalar ---
const val = (id) => document.getElementById(id).value;
const refresh = () => render();
const acts = {
  back, reload: () => location.reload(),
  go: (d) => go(d.v, d.id ? { id: d.id } : {}),
  openT: (d) => go("tournament", { id: d.id }),
  adtab: (d) => { st.ad.tab = d.v; refresh(); },
  psearch: () => { st.ad.q = val("psearch"); refresh(); },
  theme: (d) => { prefs.theme = d.v; applyPrefs(); refresh(); },
  anim: (d) => { prefs.anim = d.v === "1"; applyPrefs(); refresh(); },
  tglink: (d, el, e) => { if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(el.href); } },
  async saveP() {
    const nick = val("nick").trim(), pid = val("pid").trim(), er = document.getElementById("perr"); er.textContent = "";
    if (nick.length < 2) return (er.textContent = "Nikneym kamida 2 belgi bo'lishi kerak");
    if (!/^\d{5,15}$/.test(pid)) return (er.textContent = "PUBG ID faqat raqamlardan iborat bo'lishi kerak (5–15 ta raqam)");
    try { st.me = await api("PUT", "/api/me/pubg", { pubg_nick: nick, pubg_id: pid }); toast("Profil saqlandi ✅"); } catch (e) { er.textContent = e.message; }
  },
  async reg(d) { if (await run(() => api("POST", `/api/tournaments/${d.id}/register`), "Ariza yuborildi ✅") !== null) refresh(); },
  async unreg(d) { if (await ask("Arizani bekor qilasizmi?") && await run(() => api("DELETE", `/api/tournaments/${d.id}/register`), "Ariza bekor qilindi") !== null) refresh(); },
  async saveT(d) {
    const body = { name: val("f_name"), description: val("f_desc"), start_at: val("f_start") || null, map: val("f_map"), capacity: Number(val("f_cap")), reg_status: val("f_reg"), published: val("f_pub") === "1" };
    try { await api(d.id ? "PUT" : "POST", d.id ? "/api/admin/tournaments/" + d.id : "/api/admin/tournaments", body); toast("Saqlandi ✅"); back(); } catch (e) { document.getElementById("ferr").textContent = e.message; }
  },
  async delT(d) { if (await ask("Turnir va uning barcha ma'lumotlari o'chiriladi. Davom etasizmi?") && await run(() => api("DELETE", "/api/admin/tournaments/" + d.id), "O'chirildi") !== null) { st.stack = st.stack.filter((v) => v.name !== "adminT"); back(); } },
  async reg2(d) { const r = d.s === "remove" ? api("DELETE", `/api/admin/tournaments/${d.id}/registrations/${d.u}`) : api("POST", `/api/admin/tournaments/${d.id}/registrations/${d.u}/${d.s}`); if (d.s !== "remove" || await ask("Ishtirokchini olib tashlaysizmi?")) { if (await run(() => r) !== null) refresh(); } },
  async apprAll(d) { if (await run(() => api("POST", `/api/admin/tournaments/${d.id}/approve-all`), "Tasdiqlandi ✅") !== null) refresh(); },
  async genB(d) { if (await run(() => api("POST", `/api/admin/tournaments/${d.id}/bracket`), "Bracket tuzildi ✅") !== null) refresh(); },
  async resetB(d) { if (await ask("Bracket va barcha natijalar o'chiriladi. Davom etasizmi?") && await run(() => api("DELETE", `/api/admin/tournaments/${d.id}/bracket`), "Bracket o'chirildi") !== null) refresh(); },
  async win(d) { if (await ask("Bu o'yinchini g'olib deb belgilaysizmi?") && await run(() => api("POST", `/api/admin/matches/${d.m}/winner`, { winnerId: Number(d.w) }), "G'olib saqlandi ✅") !== null) refresh(); },
  async unwin(d) { if (await ask("Natijani bekor qilasizmi?") && await run(() => api("DELETE", `/api/admin/matches/${d.m}/winner`), "Natija bekor qilindi") !== null) refresh(); },
  async bdg(d) { if (await run(() => api(d.o === "1" ? "DELETE" : "POST", d.o === "1" ? `/api/admin/players/${d.u}/badges/${d.b}` : `/api/admin/players/${d.u}/badges`, d.o === "1" ? undefined : { badgeId: Number(d.b) }), d.o === "1" ? "Nishon olib tashlandi" : "Nishon berildi ✅") !== null) refresh(); },
  async bmove(d) { const a = st.ad.banners.map((b) => b.id), i = +d.i, j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; if (await run(() => api("POST", "/api/admin/banners/reorder", { ids: a })) !== null) refresh(); },
  bimg: () => pickImage(900, "image/jpeg", (u) => { st.draft.image = u; document.getElementById("b_prev").innerHTML = `<img src="${u}" style="width:100%;border-radius:12px">`; }),
  bimgx: () => { st.draft.image = null; document.getElementById("b_prev").textContent = "Rasm tanlanmagan"; },
  async saveB(d) { const b = { title: val("b_title"), subtitle: val("b_sub"), image: st.draft.image, enabled: val("b_on") === "1" }; if (await run(() => api(d.id ? "PUT" : "POST", d.id ? "/api/admin/banners/" + d.id : "/api/admin/banners", b), "Saqlandi ✅") !== null) back(); },
  async delB(d) { if (await ask("Banner o'chirilsinmi?") && await run(() => api("DELETE", "/api/admin/banners/" + d.id), "O'chirildi") !== null) back(); },
  gimg: () => pickImage(96, "image/png", (u) => { st.draft.icon = u; document.getElementById("g_icon").value = ""; document.getElementById("g_prev").innerHTML = badgeHtml({ icon: u, name: "Ko'rinishi", description: "" }); }),
  async saveG(d) { const typed = val("g_icon").trim(); const b = { name: val("g_name"), icon: typed || st.draft.icon, description: val("g_desc"), enabled: val("g_on") === "1" }; if (await run(() => api(d.id ? "PUT" : "POST", d.id ? "/api/admin/badges/" + d.id : "/api/admin/badges", b), "Saqlandi ✅") !== null) back(); },
  async delG(d) { if (await ask("Nishon va uning barcha berilganlari o'chiriladi. Davom etasizmi?") && await run(() => api("DELETE", "/api/admin/badges/" + d.id), "O'chirildi") !== null) back(); },
};
document.addEventListener("click", (e) => {
  const tab = e.target.closest("#nav button");
  if (tab) { st.tab = tab.dataset.tab; st.stack = []; st.view = { name: st.tab === "turnir" ? "home" : "profile" }; render(); return; }
  const el = e.target.closest("[data-act]");
  if (el && acts[el.dataset.act]) acts[el.dataset.act](el.dataset, el, e);
});
render();
</script>
</body>
</html>
